version: 2.1

#  CircleCI orb encapsulating Cloudsmith upload

orbs:
  cloudsmith-upload:
    commands:
      upload-plugin:
        description: "Upload OpenCPN plugin artifacts to Cloudsmith (FILES format)"
        parameters:
          build-dir:
            type: string
          repo:
            type: string
          version:
            type: string
          pkg-ext:
            type: string
            default: "deb"
        steps:
          - run:
              name: Install cloudsmith-cli
              command: |
                if ! command -v cloudsmith >/dev/null 2>&1; then
                  sudo apt-get update
                  sudo apt-get install -y python3-pip python3-setuptools
                  sudo python3 -m pip install -q cloudsmith-cli
                fi
          - run:
              name: Upload artifacts to Cloudsmith
              command: |
                BUILD_DIR="<< parameters.build-dir >>"
                REPO="<< parameters.repo >>"
                VERSION="<< parameters.version >>"
                PKG_EXT="<< parameters.pkg-ext >>"

                xml=$(ls "$BUILD_DIR"/*.xml)
                tarball=$(ls "$BUILD_DIR"/*.tar.gz)
                pkg=$(ls "$BUILD_DIR"/*.${PKG_EXT} 2>/dev/null || echo "")

                cloudsmith push files "$REPO" "$xml" \
                  --republish --no-wait-for-sync \
                  --name "@PACKAGE_NAME@-metadata" \
                  --version "$VERSION" \
                  --summary "@PACKAGE@ opencpn plugin metadata"

                cloudsmith push files "$REPO" "$tarball" \
                  --republish --no-wait-for-sync \
                  --name "@PACKAGE_NAME@-tarball" \
                  --version "$VERSION" \
                  --summary "@PACKAGE@ opencpn plugin tarball"

                if [ "$PKG_EXT" != "gz" ] && [ -n "$pkg" ]; then
                  cloudsmith push files "$REPO" "$pkg" \
                    --republish --no-wait-for-sync \
                    --name "opencpn-package-@PACKAGE@-${VERSION}.${PKG_EXT}" \
                    --version "$VERSION" \
                    --summary "@PACKAGE@ installer package"
                fi
