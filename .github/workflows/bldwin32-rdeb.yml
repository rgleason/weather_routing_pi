name: bldwin32-rdeb

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-win32:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows
      VCPKG_TARGET_TRIPLET: x86-windows

    steps:
      - uses: actions/checkout@v4

      - name: MSVC dev cmd (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install gettext tools
        shell: pwsh
        run: |
          choco install gettext --version 1.0.0.20260310 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Start-Sleep -Seconds 10
            choco install gettext --version 1.0.0.20260310 -y --no-progress
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey could not install gettext"
          }
          $gettextBin = "C:\Program Files\gettext-iconv\bin"
          $env:PATH = "$gettextBin;$env:PATH"
          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command msgfmt
          Get-Command msgmerge

      - name: Prepare vcpkg (x86-windows)
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgJsonGlob: vcpkg.json

      - name: Configure (CMake, Win32, RelWithDebInfo)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A Win32 -T v143 `
            -DOCPN_TARGET=MSVC `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake"

      - name: Build (RelWithDebInfo)
        run: cmake --build build --target package --config RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win32-rdeb-package
          path: build/**
