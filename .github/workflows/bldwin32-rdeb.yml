name: windows-rdeb

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
        triplet: [x86-windows, x64-windows]
        include:
          - arch: Win32
            triplet: x86-windows
          - arch: x64
            triplet: x64-windows

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache gettext
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib\gettext
          key: gettext-${{ runner.os }}

      - name: Install gettext tools
        shell: pwsh
        run: |
          if (Test-Path "C:\ProgramData\chocolatey\lib\gettext") {
              Write-Host "Using cached gettext"
          } else {
              choco install gettext -y --no-progress
          }

          # Version-agnostic + SHA256 verification
          $gettextRoot = Get-ChildItem "C:\ProgramData\chocolatey\lib\gettext" -Directory | Select-Object -First 1
          $nupkg = Get-ChildItem $gettextRoot.FullName -Filter *.nupkg | Select-Object -First 1
          $hash = (Get-FileHash $nupkg.FullName -Algorithm SHA256).Hash
          Write-Host "SHA256(gettext): $hash"

          $gettextBinCandidates = @(
              Join-Path $gettextRoot.FullName "tools\bin",
              Join-Path $gettextRoot.FullName "tools\gettext-iconv\bin",
              Join-Path $gettextRoot.FullName "bin"
          )
          $gettextBin = $gettextBinCandidates | Where-Object { Test-Path "$_\msgfmt.exe" } | Select-Object -First 1
          if (-not $gettextBin) { throw "msgfmt.exe not found" }

          $env:PATH = "$gettextBin;$env:PATH"
          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Prepare vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -T v143 `
            -DOCPN_TARGET=MSVC `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --target package --config RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-rdeb-package
          path: build/**
