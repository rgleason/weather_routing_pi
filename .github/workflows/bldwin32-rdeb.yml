name: windows-rdeb

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
        triplet: [x86-windows, x64-windows]
        include:
          - arch: Win32
            triplet: x86-windows
          - arch: x64
            triplet: x64-windows

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache gettext
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib\gettext
          key: gettext-${{ runner.os }}

      - name: Install gettext tools
        shell: pwsh
        run: |
          # If cached, skip installation
          if (Test-Path "C:\ProgramData\chocolatey\lib\gettext") {
              Write-Host "Using cached gettext"
          } else {
              choco install gettext -y --no-progress
          }

          # Locate the installer EXE used by Chocolatey (version-agnostic)
          $installer = Get-ChildItem "C:\ProgramData\chocolatey\lib\gettext" -Recurse -Filter *.exe |
                       Where-Object { $_.Name -match "gettext.*\.exe" } |
                       Select-Object -First 1

          if ($installer) {
              $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
              Write-Host "SHA256(gettext installer): $hash"
          } else {
              Write-Host "WARNING: No gettext installer EXE found for SHA256 verification."
          }

          # Locate gettext bin directory (version-agnostic)
          $gettextBinCandidates = @(
              "C:\Program Files\gettext-iconv\bin",
              "C:\Program Files (x86)\gettext-iconv\bin",
              "C:\ProgramData\chocolatey\lib\gettext\tools\bin",
              "C:\ProgramData\chocolatey\lib\gettext\tools\gettext-iconv\bin"
          )

          $gettextBin = $gettextBinCandidates |
                        Where-Object { Test-Path "$_\msgfmt.exe" } |
                        Select-Object -First 1

          if (-not $gettextBin) {
              throw "msgfmt.exe not found in any known gettext bin directory"
          }

          Write-Host "Using gettext bin: $gettextBin"

          # Export PATH
          $env:PATH = "$gettextBin;$env:PATH"
          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Confirm tools
          Get-Command msgfmt
          Get-Command msgmerge


      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Prepare vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -T v143 `
            -DOCPN_TARGET=MSVC `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --target package --config RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-rdeb-package
          path: build/**
