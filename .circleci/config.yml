      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/android-armhf/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh

# -------------------------
# Top-level anchor definition
# -------------------------
validation-filters: &validation-filters
  branches:
    ignore: [devel, tmp]
  tags:
    ignore: /.*/
    
# ------------------------------------------------------------
# WORKFLOWS   VALIDATE
# ------------------------------------------------------------    

workflows:
  validate:
    when: << pipeline.parameters.run_validate >>
    jobs:
      - linux-catalogue:
          name: debian13-x86_64
          target: trixie
          image: debian:trixie
          filters: *validation-filters

      - linux-catalogue:
          name: debian12-x86_64
          target: bookworm
          image: debian:bookworm
          filters: *validation-filters

      - linux-catalogue:
          name: debian12-arm64
          target: bookworm-arm64
          image: arm64v8/debian:bookworm
          resource_class: arm.medium
          filters: *validation-filters          

      - linux-catalogue:
          name: ubuntu22.04-x86_64
          target: jammy
          image: ubuntu:22.04
          dockerfile: ci/Dockerfile.jammy
          filters: *validation-filters

      - linux-catalogue:
          name: ubuntu24.04-x86_64
          target: noble
          image: ubuntu:24.04
          filters: *validation-filters

      - flatpak:
          name: flatpak25.08-x86_64
          arch: x86_64
          filters: *validation-filters

      - flatpak:
          name: flatpak25.08-aarch64
          arch: aarch64
          resource_class: arm.medium
          filters: *validation-filters

      - macos-universal:
          filters: *validation-filters

      - windows-x86:
          filters: *validation-filters

      - android-arm64:
          name: android-arm64
          resource_class: medium
          filters: *validation-filters

      - android-armhf:
          name: android-armhf
          resource_class: medium
          filters: *validation-filters

# ------------------------------------------------------------
# WORKFLOWS  BUILD / DEPLOY
# ------------------------------------------------------------    
  build_and_deploy:
    jobs:
      # debian13-x86_64
      - build-debian-x86_64-13:
          when: << pipeline.parameters.build_debian_x86_64_13 >>
      - deploy-debian-x86_64-13:
          when: << pipeline.parameters.deploy_debian_x86_64_13 >>

      # debian12-x86_64
      - build-debian-x86_64-12:
          when: << pipeline.parameters.build_debian_x86_64_12 >>
      - deploy-debian-x86_64-12:
          when: << pipeline.parameters.deploy_debian_x86_64_12 >>

      # debian12-arm64
      - build-debian-arm64-12:
          when: << pipeline.parameters.build_debian_arm64_12 >>
      - deploy-debian-arm64-12:
          when: << pipeline.parameters.deploy_debian_arm64_12 >>

      # ubuntu22.04-x86_64
      - build-ubuntu-x86_64-2204:
          when: << pipeline.parameters.build_ubuntu_x86_64_2204 >>
      - deploy-ubuntu-x86_64-2204:
          when: << pipeline.parameters.deploy_ubuntu_x86_64_2204 >>

      # ubuntu24.04-x86_64
      - build-ubuntu-x86_64-2404:
          when: << pipeline.parameters.build_ubuntu_x86_64_2404 >>
      - deploy-ubuntu-x86_64-2404:
          when: << pipeline.parameters.deploy_ubuntu_x86_64_2404 >>

      # flatpak25.08-x86_64
      - build-flatpak-x86-2408:
          when: << pipeline.parameters.build_flatpak_x86_2408 >>
      - deploy-flatpak-x86-2408:
          when: << pipeline.parameters.deploy_flatpak_x86_2408 >>

      # flatpak25.08-aarch64
      - build-flatpak-aarch64-2408:
          when: << pipeline.parameters.build_flatpak_aarch64_2408 >>
      - deploy-flatpak-aarch64-2408:
          when: << pipeline.parameters.deploy_flatpak_aarch64_2408 >>

      # macOS universal
      - build-macos-universal:
          when: << pipeline.parameters.build_macos_universal >>
      - deploy-macos-universal:
          when: << pipeline.parameters.deploy_macos_universal >>

      # windows-x86 (msvc_wx32_2022)
      - build-msvc-wx32-2022:
          when: << pipeline.parameters.build_msvc_wx32_2022 >>
      - deploy-msvc-wx32-2022:
          when: << pipeline.parameters.deploy_msvc_wx32_2022 >>

      # android-arm64
      - build-android-arm64:
          when: << pipeline.parameters.build_android_arm64 >>
      - deploy-android-arm64:
          when: << pipeline.parameters.deploy_android_arm64 >>

      # android-armhf
      - build-android-armhf:
          when: << pipeline.parameters.build_android_armhf >>
      - deploy-android-armhf:
          when: << pipeline.parameters.deploy_android_armhf >>
