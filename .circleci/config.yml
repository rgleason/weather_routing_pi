version: 2.1

# Validation is separate from publishing. Production and xWeatherRouting Alpha
# have explicit identities/destinations and share a reviewable approval hold.
parameters:
  run_workflow_deploy:
    type: boolean
    default: false
  run_windows_only:
    type: boolean
    default: false
  build_xweather_identity:
    type: boolean
    default: false
  publication_channel:
    type: enum
    enum: [production, xweather-alpha]
    default: production
  release_workflow_id:
    type: string
    default: ""

orbs:
  win: circleci/windows@5.1.0

commands:
  retain-artifacts:
    parameters:
      target: {type: string}
      api_headers: {type: string, default: "1.21"}
      build_dir: {type: string, default: build}
    steps:
      - run:
          name: Retain artifacts for << parameters.target >>
          when: always
          command: |
            mkdir -p artifacts/<< parameters.target >>/package test-results
            find << parameters.build_dir >> -maxdepth 3 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' -o -name 'SHA256SUMS' \) \
              -exec cp -f '{}' artifacts/<< parameters.target >>/package/ \; || true
            find artifacts -type f -name '*ctest.xml' \
              -exec cp -f '{}' test-results/ \; || true
      - run:
          name: Verify OpenCPN package ABI for << parameters.target >>
          command: python3 ci/verify-package-abi.py artifacts/<< parameters.target >>/package --target << parameters.target >>
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts/<< parameters.target >>
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/<< parameters.target >>]

jobs:
  linux-catalogue:
    parameters:
      api_headers: {type: string, default: "1.21"}
      target: {type: string}
      image: {type: string}
      dockerfile: {type: string, default: ci/Dockerfile.linux}
      resource_class: {type: string, default: medium}
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: << parameters.target >>
      DOCKER_IMAGE: << parameters.image >>
      DOCKERFILE: << parameters.dockerfile >>
      BUILD_GTK3: "true"
      WX_VER: "32"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - stock-host-ccache-v1-<< parameters.target >>-{{ checksum "ci/stock-hosts.json" }}-{{ checksum "ci/test-linux-installed-host.sh" }}-{{ checksum "ci/install-debian-build-deps.sh" }}-
      - run: chmod a+x ci/*.sh
      - run:
          name: Publication contract tests
          command: python3 -m unittest discover -s ci/tests -v
      - run:
          name: Stock-API tests, clean package and archive validation
          command: ci/circleci-build-ubuntu-docker.sh
          no_output_timeout: 45m
      - save_cache:
          key: stock-host-ccache-v1-<< parameters.target >>-{{ checksum "ci/stock-hosts.json" }}-{{ checksum "ci/test-linux-installed-host.sh" }}-{{ checksum "ci/install-debian-build-deps.sh" }}-{{ .BuildNum }}
          paths: [.circleci-cache/linux-stock-host]
      - retain-artifacts:
          api_headers: << parameters.api_headers >>
          target: << parameters.target >>

  flatpak:
    parameters:
      api_headers: {type: string, default: "1.21"}
      arch: {type: string}
      resource_class: {type: string, default: medium}
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: flatpak
      BUILD_ARCH: << parameters.arch >>
      FLATPAK_BRANCH: stable
      SDK_VER: "25.08"
      WX_VER: "32"
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Flatpak build and package
          command: ci/circleci-build-flatpak.sh
          no_output_timeout: 45m
      - retain-artifacts:
          api_headers: << parameters.api_headers >>
          target: flatpak-<< parameters.arch >>

  macos-universal:
    parameters:
      api_headers: {type: string, default: "1.21"}
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: macos
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      WX_VER: "32"
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
    steps:
      - checkout
      - run: chmod a+x ci/*.sh cmake/*.sh
      - run:
          name: Native Apple-Silicon stock-API build, tests and package
          command: ci/circleci-build-macos-universal.sh
          no_output_timeout: 45m
      - retain-artifacts:
          api_headers: << parameters.api_headers >>
          target: macos-arm64
          build_dir: build-package

  windows-x86:
    parameters:
      api_headers: {type: string, default: "1.21"}
    executor:
      name: win/server-2022
      shell: bash.exe
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: MSVC
      MSVC_VERSION: "2022"
      WX_VER: "32"
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
      WR_HEADLESS_LIFECYCLE_CONTRACT: "1"
    steps:
      - checkout
      - run:
          shell: cmd.exe
          name: Native Windows build, tests and package
          command: ci\circleci-build-msvc.bat
          no_output_timeout: 45m
      - run:
          name: Verify Windows x86 package ABI
          command: python ci/verify-package-abi.py artifacts/windows-x86/package --target windows-x86
      - store_test_results:
          path: artifacts/windows-x86/tests
      - store_artifacts:
          path: artifacts/windows-x86
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/windows-x86]

  windows-x64:
    parameters:
      api_headers: {type: string, default: "1.21"}
    executor:
      name: win/server-2022
      shell: bash.exe
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
      WR_HEADLESS_LIFECYCLE_CONTRACT: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows64-upstream-v1-{{ checksum "ci/windows64-sdk.json" }}
      - run:
          shell: cmd.exe
          name: Upstream OpenCPN 5.14.2 x64 build, tests and import verification
          command: ci\circleci-build-windows64.bat
          no_output_timeout: 45m
      - run:
          name: Verify Windows x64 package ABI
          command: python ci/verify-package-abi.py artifacts/windows-x64/package --target windows-x64
      - save_cache:
          key: windows64-upstream-v1-{{ checksum "ci/windows64-sdk.json" }}
          paths: [.windows64/cache]
      - store_test_results:
          path: artifacts/windows-x64/tests
      - store_artifacts:
          path: artifacts/windows-x64
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/windows-x64]

  publication-contracts:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Verify both publication channels and source qualification guards
          command: |
            python3 -m pip install --user PyYAML==6.0.2
            python3 ci/check-publication-config.py
            python3 -m unittest discover -s ci/tests -v

  publication-preflight:
    docker:
      - image: cimg/python:3.13
    environment:
      WR_RELEASE_CHANNEL: "<< pipeline.parameters.publication_channel >>"
      WR_RELEASE_WORKFLOW_ID: "<< pipeline.parameters.release_workflow_id >>"
      WR_BUILD_XWEATHER: "<< pipeline.parameters.build_xweather_identity >>"
    steps:
      - checkout
      - run:
          name: Check product and publication destination before building
          command: |
            python3 ci/check-publication-request.py --channel "$WR_RELEASE_CHANNEL" \
              --xweather "$WR_BUILD_XWEATHER" --workflow-id "$WR_RELEASE_WORKFLOW_ID"

  stage-publication:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/project
    environment:
      WR_RELEASE_CHANNEL: "<< pipeline.parameters.publication_channel >>"
      WR_RELEASE_WORKFLOW_ID: "<< pipeline.parameters.release_workflow_id >>"
    steps:
      - checkout
      - run:
          name: Install offline catalogue schema validator
          command: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run:
          name: Recover qualified packages and prepare the exact publication for review
          command: bash ci/stage-reviewed-artifacts.sh
      - store_artifacts:
          path: reviewed-publication
      - persist_to_workspace:
          root: .
          paths: [reviewed-publication]

  publish-reviewed:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/project
    environment:
      WR_RELEASE_CHANNEL: "<< pipeline.parameters.publication_channel >>"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install deployment client
          command: python -m pip install --user cloudsmith-cli
      - run:
          name: Publish the reviewed product to its selected repository
          command: python3 ci/deploy-reviewed-artifacts.py reviewed-publication --channel "$WR_RELEASE_CHANNEL"
      - store_artifacts:
          path: reviewed-publication

  android-arm64:
    parameters:
      api_headers: {type: string, default: "1.21"}
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity >>
    steps:
      - checkout
      - run:
          name: Install Android cross-build tools
          command: |
            sudo apt-get update
            sudo apt-get install -y git cmake curl unzip gettext python3 openjdk-17-jdk-headless
      - run:
          name: Build OpenCPN 5.14 core and selected plugin for Android arm64
          command: bash ci/build-android-arm64.sh
          no_output_timeout: 60m
      - run:
          name: Verify Android package ABI
          command: python3 ci/verify-package-abi.py artifacts/android-arm64/package --target android-arm64
      - store_artifacts:
          path: artifacts/android-arm64
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/android-arm64]


validation-filters: &validation-filters
  branches:
    ignore: [devel, tmp]
  tags:
    ignore: /.*/

workflows:
  validate:
    when:
      and:
        - not: << pipeline.parameters.run_workflow_deploy >>
        - not: << pipeline.parameters.run_windows_only >>
    jobs:
      - publication-contracts
      - linux-catalogue: &trixie
          name: debian13-x86_64
          target: trixie
          image: debian:trixie
          filters: *validation-filters
      - linux-catalogue: &bookworm
          name: debian12-x86_64
          target: bookworm
          image: debian:bookworm
          filters: *validation-filters
      - linux-catalogue: &jammy
          name: ubuntu22.04-x86_64
          target: jammy
          image: ubuntu:22.04
          dockerfile: ci/Dockerfile.jammy
          filters: *validation-filters
      - linux-catalogue: &noble
          name: ubuntu24.04-x86_64
          target: noble
          image: ubuntu:24.04
          filters: *validation-filters
      - linux-catalogue: &bookworm-arm64
          name: debian12-arm64
          target: bookworm-arm64
          image: arm64v8/debian:bookworm
          resource_class: arm.medium
          filters: *validation-filters
      - flatpak: &flatpak-x86
          name: flatpak25.08-x86_64
          arch: x86_64
          filters: *validation-filters
      - flatpak: &flatpak-arm
          name: flatpak25.08-aarch64
          arch: aarch64
          resource_class: arm.medium
          filters: *validation-filters
      - windows-x86:
          filters: *validation-filters
      - windows-x64:
          filters: *validation-filters
      - macos-universal:
          filters: *validation-filters
      - android-arm64:
          filters: *validation-filters
      - linux-catalogue:
          name: debian13-x86_64-api122
          api_headers: "1.22"
          target: trixie
          image: debian:trixie
          filters: *validation-filters
      - linux-catalogue:
          name: debian12-x86_64-api122
          api_headers: "1.22"
          target: bookworm
          image: debian:bookworm
          filters: *validation-filters
      - linux-catalogue:
          name: ubuntu22.04-x86_64-api122
          api_headers: "1.22"
          target: jammy
          image: ubuntu:22.04
          dockerfile: ci/Dockerfile.jammy
          filters: *validation-filters
      - linux-catalogue:
          name: ubuntu24.04-x86_64-api122
          api_headers: "1.22"
          target: noble
          image: ubuntu:24.04
          filters: *validation-filters
      - linux-catalogue:
          name: debian12-arm64-api122
          api_headers: "1.22"
          target: bookworm-arm64
          image: arm64v8/debian:bookworm
          resource_class: arm.medium
          filters: *validation-filters
      - flatpak:
          name: flatpak25.08-x86_64-api122
          api_headers: "1.22"
          arch: x86_64
          filters: *validation-filters
      - flatpak:
          name: flatpak25.08-aarch64-api122
          api_headers: "1.22"
          arch: aarch64
          resource_class: arm.medium
          filters: *validation-filters
      - windows-x86:
          name: windows-x86-api122
          api_headers: "1.22"
          filters: *validation-filters
      - windows-x64:
          name: windows-x64-api122
          api_headers: "1.22"
          filters: *validation-filters
      - macos-universal:
          name: macos-universal-api122
          api_headers: "1.22"
          filters: *validation-filters
      - android-arm64:
          name: android-arm64-api122
          api_headers: "1.22"
          filters: *validation-filters

  validate_windows_only:
    when:
      and:
        - not: << pipeline.parameters.run_workflow_deploy >>
        - << pipeline.parameters.run_windows_only >>
    jobs:
      - windows-x86:
          filters: *validation-filters
      - windows-x64:
          filters: *validation-filters
      - windows-x86:
          name: windows-x86-api122
          api_headers: "1.22"
          filters: *validation-filters
      - windows-x64:
          name: windows-x64-api122
          api_headers: "1.22"
          filters: *validation-filters

  build_and_publish_reviewed:
    when:
      and:
        - << pipeline.parameters.run_workflow_deploy >>
        - equal: ["", << pipeline.parameters.release_workflow_id >>]
    jobs:
      - publication-preflight
      - linux-catalogue:
          <<: *trixie
          requires: [publication-preflight]
      - linux-catalogue:
          <<: *bookworm
          requires: [publication-preflight]
      - linux-catalogue:
          <<: *jammy
          requires: [publication-preflight]
      - linux-catalogue:
          <<: *noble
          requires: [publication-preflight]
      - linux-catalogue:
          <<: *bookworm-arm64
          requires: [publication-preflight]
      - flatpak:
          <<: *flatpak-x86
          requires: [publication-preflight]
      - flatpak:
          <<: *flatpak-arm
          requires: [publication-preflight]
      - windows-x86:
          requires: [publication-preflight]
          filters: *validation-filters
      - windows-x64:
          requires: [publication-preflight]
          filters: *validation-filters
      - macos-universal:
          requires: [publication-preflight]
          filters: *validation-filters
      - android-arm64:
          requires: [publication-preflight]
          filters: *validation-filters
      - linux-catalogue:
          requires: [publication-preflight]
          name: debian13-x86_64-api122
          api_headers: "1.22"
          target: trixie
          image: debian:trixie
          filters: *validation-filters
      - linux-catalogue:
          requires: [publication-preflight]
          name: debian12-x86_64-api122
          api_headers: "1.22"
          target: bookworm
          image: debian:bookworm
          filters: *validation-filters
      - linux-catalogue:
          requires: [publication-preflight]
          name: ubuntu22.04-x86_64-api122
          api_headers: "1.22"
          target: jammy
          image: ubuntu:22.04
          dockerfile: ci/Dockerfile.jammy
          filters: *validation-filters
      - linux-catalogue:
          requires: [publication-preflight]
          name: ubuntu24.04-x86_64-api122
          api_headers: "1.22"
          target: noble
          image: ubuntu:24.04
          filters: *validation-filters
      - linux-catalogue:
          requires: [publication-preflight]
          name: debian12-arm64-api122
          api_headers: "1.22"
          target: bookworm-arm64
          image: arm64v8/debian:bookworm
          resource_class: arm.medium
          filters: *validation-filters
      - flatpak:
          requires: [publication-preflight]
          name: flatpak25.08-x86_64-api122
          api_headers: "1.22"
          arch: x86_64
          filters: *validation-filters
      - flatpak:
          requires: [publication-preflight]
          name: flatpak25.08-aarch64-api122
          api_headers: "1.22"
          arch: aarch64
          resource_class: arm.medium
          filters: *validation-filters
      - windows-x86:
          requires: [publication-preflight]
          name: windows-x86-api122
          api_headers: "1.22"
          filters: *validation-filters
      - windows-x64:
          requires: [publication-preflight]
          name: windows-x64-api122
          api_headers: "1.22"
          filters: *validation-filters
      - macos-universal:
          requires: [publication-preflight]
          name: macos-universal-api122
          api_headers: "1.22"
          filters: *validation-filters
      - android-arm64:
          requires: [publication-preflight]
          name: android-arm64-api122
          api_headers: "1.22"
          filters: *validation-filters
      - stage-publication:
          requires:
            - debian13-x86_64
            - debian12-x86_64
            - ubuntu22.04-x86_64
            - ubuntu24.04-x86_64
            - debian12-arm64
            - flatpak25.08-x86_64
            - flatpak25.08-aarch64
            - windows-x86
            - windows-x64
            - macos-universal
            - android-arm64
            - debian13-x86_64-api122
            - debian12-x86_64-api122
            - ubuntu22.04-x86_64-api122
            - ubuntu24.04-x86_64-api122
            - debian12-arm64-api122
            - flatpak25.08-x86_64-api122
            - flatpak25.08-aarch64-api122
            - windows-x86-api122
            - windows-x64-api122
            - macos-universal-api122
            - android-arm64-api122
      - hold-for-publication-approval:
          type: approval
          requires: [stage-publication]
      - publish-reviewed:
          context: xgrib-deployment
          requires: [hold-for-publication-approval]

  publish_validated_artifacts:
    when:
      and:
        - << pipeline.parameters.run_workflow_deploy >>
        - not:
            equal: ["", << pipeline.parameters.release_workflow_id >>]
    jobs:
      - publication-preflight
      - stage-publication:
          requires: [publication-preflight]
      - hold-for-publication-approval:
          type: approval
          requires: [stage-publication]
      - publish-reviewed:
          context: xgrib-deployment
          requires: [hold-for-publication-approval]
