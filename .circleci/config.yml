version: 2.1

# Validation only. Publishing to an OpenCPN catalogue remains a separate,
# explicitly approved operation and is intentionally absent from this file.

orbs:
  win: circleci/windows@5.1.0

parameters:
  cloudsmith_api_key:
    type: string
    default: CLOUDSMITH_API_KEY

commands:
  retain-linux-artifacts:
    steps:
      - run:
          name: Prepare retained evidence
          when: always
          command: |
            rm -rf test-results
            mkdir -p test-results
            if test -d artifacts; then
              find artifacts -type f -name '*ctest.xml' \
                -exec cp -f '{}' test-results/ \;
            fi
            # NEW: Copy pkg_version.sh (required for Cloudsmith)
            if [ -f build/pkg_version.sh ]; then
              cp build/pkg_version.sh artifacts/<< parameters.target >>/package/
            else
              echo "WARNING: build/pkg_version.sh not found"
            fi            
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts

jobs:

  linux-catalogue:
    parameters:
      target: {type: string}
      image: {type: string}
      dockerfile: {type: string, default: ci/Dockerfile.linux}
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: << parameters.target >>
      DOCKER_IMAGE: << parameters.image >>
      DOCKERFILE: << parameters.dockerfile >>
      BUILD_GTK3: "true"
      WX_VER: "32"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Stock-API tests, clean package and archive validation
          shell: /bin/bash
          command: ci/circleci-build-ubuntu-docker.sh
          no_output_timeout: 45m
      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/<< parameters.target >>/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh
      - retain-linux-artifacts

  flatpak:
    parameters:
      arch: {type: string}
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: flatpak
      BUILD_ARCH: << parameters.arch >>
      FLATPAK_BRANCH: stable
      CLOUDSMITH_PKG_EXT: gz
      SDK_VER: "25.08"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Flatpak build and package
          shell: /bin/bash
          command: ci/circleci-build-flatpak.sh
          no_output_timeout: 45m
      - run:
          name: Retain Flatpak package
          when: always
          command: |
            mkdir -p artifacts/flatpak-<< parameters.arch >>/package
            find build -maxdepth 2 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' \) \
              -exec cp -f '{}' artifacts/flatpak-<< parameters.arch >>/package/ \; \
              || true
            # NEW: copy pkg_version.sh
            if [ -f build/pkg_version.sh ]; then
                cp build/pkg_version.sh artifacts/flatpak-<< parameters.arch >>/package/
            else
                echo "WARNING: build/pkg_version.sh not found"
            fi              
      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/flatpak-<< parameters.arch >>/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh
      - retain-linux-artifacts

  windows-x86:
    executor:
      name: win/server-2022
      shell: bash.exe

    environment:
      OCPN_TARGET: MSVC
      MSVC_VERSION: "2022"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout

      - run:
          name: Ensure Python3 exists on Windows
          shell: powershell.exe
          command: |
            if (-Not (Get-Command python3 -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Python3..."
              choco install python --version=3.10.11 -y
            }

      - run:
          privileged: false
          shell: cmd.exe
          name: Native Windows build, tests and package
          command: ci\circleci-build-msvc.bat
          no_output_timeout: 45m

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            export PATH="/c/Python310:/c/Python310/Scripts:$PATH"
            export PATH="/c/Program Files/Python310:/c/Program Files/Python310/Scripts:$PATH"
            export PATH="/c/Users/circleci/AppData/Local/Programs/Python/Python310:/c/Users/circleci/AppData/Local/Programs/Python/Python310/Scripts:$PATH"
            
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/build"
            export CLOUDSMITH_PKG_EXT="exe"
            ci/cloudsmith-upload.sh

      - store_test_results:
          path: build/test-results

      - store_artifacts:
          path: build
          destination: windows-x86

  macos-universal:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

    environment:
      OCPN_TARGET: macos
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh cmake/*.sh
      - run:
          name: Native Apple-Silicon stock-API build, tests and package
          shell: /bin/bash
          command: ci/circleci-build-macos-universal.sh
          no_output_timeout: 45m
      - run:
          name: Retain macOS package
          when: always
          command: |
            mkdir -p artifacts/macos-arm64/package
            find artifacts/macos-arm64 -maxdepth 2 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' \) \
              -exec cp -f '{}' artifacts/macos-arm64/package/ \; \
              || true

            # Copy pkg_version.sh (required for Cloudsmith)
            if [ -f build/pkg_version.sh ]; then
              cp build/pkg_version.sh artifacts/macos-arm64/package/
            else
              echo "WARNING: build/pkg_version.sh not found"
            fi

            # Copy generated cloudsmith-upload.sh
            if [ -f build/cloudsmith-upload.sh ]; then
              cp build/cloudsmith-upload.sh artifacts/macos-arm64/package/
            else
              echo "WARNING: build/cloudsmith-upload.sh not found"
            fi
          
      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/macos-arm64/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh
      - store_test_results:
          path: artifacts/macos-arm64/tests
      - store_artifacts:
          path: artifacts/macos-arm64

  android-arm64:
    parameters:
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: android-arm64
      WX_VER: "32"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_VERSION: "34"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Android ARM64 build
          shell: /bin/bash
          command: |
            chmod +x ci/circleci-build-android-arm64.sh
            ci/circleci-build-android-arm64.sh
          no_output_timeout: 45m

      - run:
          name: Retain Android ARM64 package
          when: always
          command: |
            mkdir -p artifacts/android-arm64/package
            find build -maxdepth 2 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' \) \
              -exec cp -f '{}' artifacts/android-arm64/package/ \; \
              || true
            # Copy pkg_version.sh (required for Cloudsmith)
            if [ -f build/pkg_version.sh ]; then
              cp build/pkg_version.sh artifacts/android-arm64/package/
            else
              echo "WARNING: build/pkg_version.sh not found"
            fi              

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/android-arm64/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh

      - run:
          name: Prepare Android ARM64 test results directory
          when: always
          command: |
            mkdir -p artifacts/android-arm64/tests

      - store_test_results:
          path: artifacts/android-arm64/tests

      - store_artifacts:
          path: artifacts/android-arm64


  android-armhf:
    parameters:
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: android-armhf
      WX_VER: "32"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_VERSION: "34"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh

      - run:
          name: Android ARMHF build
          shell: /bin/bash
          command: |
            chmod +x ci/circleci-build-android-armhf.sh
            ci/circleci-build-android-armhf.sh
          no_output_timeout: 45m

      - run:
          name: Retain Android ARMHF package
          when: always
          command: |
            mkdir -p artifacts/android-armhf/package
            find build -maxdepth 2 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' \) \
              -exec cp -f '{}' artifacts/android-armhf/package/ \; \
              || true
            # Copy pkg_version.sh (required for Cloudsmith)
            if [ -f build/pkg_version.sh ]; then
              cp build/pkg_version.sh artifacts/android-armhf/package/
            else
              echo "WARNING: build/pkg_version.sh not found"
            fi              

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/android-armhf/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh

      - run:
          name: Prepare Android ARMHF test results directory
          when: always
          command: |
            mkdir -p artifacts/android-armhf/tests

      - store_test_results:
          path: artifacts/android-armhf/tests

      - store_artifacts:
          path: artifacts/android-armhf



# -------------------------
# Top-level anchor definition
# -------------------------
validation-filters: &validation-filters
  branches:
    ignore: [devel, tmp]
  tags:
    ignore: /.*/

workflows:
  validate:
    jobs:
      - linux-catalogue:
          name: debian13-x86_64
          target: trixie
          image: debian:trixie
          filters: *validation-filters

      - linux-catalogue:
          name: debian12-x86_64
          target: bookworm
          image: debian:bookworm
          filters: *validation-filters

      - linux-catalogue:
          name: ubuntu22.04-x86_64
          target: jammy
          image: ubuntu:22.04
          dockerfile: ci/Dockerfile.jammy
          filters: *validation-filters

      - linux-catalogue:
          name: ubuntu24.04-x86_64
          target: noble
          image: ubuntu:24.04
          filters: *validation-filters

      - linux-catalogue:
          name: debian12-arm64
          target: bookworm-arm64
          image: arm64v8/debian:bookworm
          resource_class: arm.medium
          filters: *validation-filters

      - flatpak:
          name: flatpak25.08-x86_64
          arch: x86_64
          filters: *validation-filters

      - flatpak:
          name: flatpak25.08-aarch64
          arch: aarch64
          resource_class: arm.medium
          filters: *validation-filters

      - windows-x86:
          filters: *validation-filters

      - macos-universal:
          filters: *validation-filters

      - android-arm64:
          name: android-arm64
          resource_class: medium
          filters: *validation-filters

      - android-armhf:
          name: android-armhf
          resource_class: medium
          filters: *validation-filters
