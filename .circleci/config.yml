version: 2.1

# Validation only. Publishing to an OpenCPN catalogue remains a separate,
# explicitly approved operation and is intentionally absent from this file.

# ---------------------------------------------------------
# Build and Deploy Matrix
# ---------------------------------------------------------

matrix:
  debian_x86_64_13:     { build: 1, deploy: 1 }
  debian_x86_64_12:     { build: 0, deploy: 0 }
  debian_arm64_12:      { build: 0, deploy: 0 }
  debian_arm64_13:      { build: 0, deploy: 0 }
  debian_armhf_13:      { build: 0, deploy: 0 }

  ubuntu_x86_64_2204:   { build: 1, deploy: 1 }
  ubuntu_x86_64_2404:   { build: 1, deploy: 0 }

  flatpak_x86_2408:     { build: 1, deploy: 1 }
  flatpak_aarch64_2408: { build: 0, deploy: 0 }

  macos_universal:      { build: 1, deploy: 1 }

  msvc_wx32_2022:       { build: 1, deploy: 1 }

  android_arm64:        { build: 0, deploy: 0 }
  android_armhf:        { build: 0, deploy: 0 }


# ---------------------------------------------------------
# Win/server-2022 executor, images, env, 
# shell support (bash.exe, powershell.exe, cmd.exe)
# ----------------------------------------------------------

orbs:
  win: circleci/windows@5.1.0
  
# ------------------------------------------------------------
# Unified reusable command for artifact retention
# ------------------------------------------------------------
   
commands:
  retain-artifacts:
    parameters:
      target:
        type: string
      build_dir:
        type: string
        default: build
    steps:
      - run:
          name: Retain artifacts for << parameters.target >>
          when: always
          command: |
            mkdir -p artifacts/<< parameters.target >>/package

            # Copy tarballs, XML, logs, SHA256SUMS
            find << parameters.build_dir >> -maxdepth 2 -type f \
              \( -name '*.tar.gz' -o -name '*.xml' -o -name '*.log' -o -name 'SHA256SUMS' \) \
              -exec cp -f '{}' artifacts/<< parameters.target >>/package/ \; \
              || true

            # Copy pkg_version.sh (required for Cloudsmith)
            if [ -f << parameters.build_dir >>/pkg_version.sh ]; then
              cp << parameters.build_dir >>/pkg_version.sh artifacts/<< parameters.target >>/package/
            else
              echo "WARNING: pkg_version.sh not found in << parameters.build_dir >>"
            fi

            # Copy generated cloudsmith-upload.sh (required for Cloudsmith)
            if [ -f << parameters.build_dir >>/cloudsmith-upload.sh ]; then
              cp << parameters.build_dir >>/cloudsmith-upload.sh artifacts/<< parameters.target >>/package/
            else
              echo "WARNING: cloudsmith-upload.sh not found in << parameters.build_dir >>"
            fi

# ------------------------------------------------------------
# Global pipeline parameters
# ------------------------------------------------------------  

parameters:
  cloudsmith_api_key:
    type: string
    default: CLOUDSMITH_API_KEY
    
  plugin_version:
    type: string
    default: "1.17.12.0"
    
# ------------------------------------------------------------
# Validate Parameters   
# ------------------------------------------------------------
   
  run_validate:
    type: boolean
    default: false    

# ------------------------------------------------------------
# Build and Deploy Parameters
# CircleCI treats 1 as truthy and 0 as falsy, so you can map directly:
# ------------------------------------------------------------

  # debian13-x86_64
  build_debian_x86_64_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_x86_64_13.build >>
  deploy_debian_x86_64_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_x86_64_13.deploy >>

  # debian12-x86_64
  build_debian_x86_64_12:
    type: boolean
    default: << pipeline.parameters.matrix.debian_x86_64_12.build >>
  deploy_debian_x86_64_12:
    type: boolean
    default: << pipeline.parameters.matrix.debian_x86_64_12.deploy >>

  # debian12-arm64
  build_debian_arm64_12:
    type: boolean
    default: << pipeline.parameters.matrix.debian_arm64_12.build >>
  deploy_debian_arm64_12:
    type: boolean
    default: << pipeline.parameters.matrix.debian_arm64_12.deploy >>

  # debian13-arm64
  build_debian_arm64_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_arm64_13.build >>
  deploy_debian_arm64_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_arm64_13.deploy >>

  # debian13-armhf
  build_debian_armhf_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_armhf_13.build >>
  deploy_debian_armhf_13:
    type: boolean
    default: << pipeline.parameters.matrix.debian_armhf_13.deploy >>

  # ubuntu22.04-x86_64
  build_ubuntu_x86_64_2204:
    type: boolean
    default: << pipeline.parameters.matrix.ubuntu_x86_64_2204.build >>
  deploy_ubuntu_x86_64_2204:
    type: boolean
    default: << pipeline.parameters.matrix.ubuntu_x86_64_2204.deploy >>

  # ubuntu24.04-x86_64
  build_ubuntu_x86_64_2404:
    type: boolean
    default: << pipeline.parameters.matrix.ubuntu_x86_64_2404.build >>
  deploy_ubuntu_x86_64_2404:
    type: boolean
    default: << pipeline.parameters.matrix.ubuntu_x86_64_2404.deploy >>

  # flatpak25.08-x86_64
  build_flatpak_x86_2408:
    type: boolean
    default: << pipeline.parameters.matrix.flatpak_x86_2408.build >>
  deploy_flatpak_x86_2408:
    type: boolean
    default: << pipeline.parameters.matrix.flatpak_x86_2408.deploy >>

  # flatpak25.08-aarch64
  build_flatpak_aarch64_2408:
    type: boolean
    default: << pipeline.parameters.matrix.flatpak_aarch64_2408.build >>
  deploy_flatpak_aarch64_2408:
    type: boolean
    default: << pipeline.parameters.matrix.flatpak_aarch64_2408.deploy >>

  # macOS universal
  build_macos_universal:
    type: boolean
    default: << pipeline.parameters.matrix.macos_universal.build >>
  deploy_macos_universal:
    type: boolean
    default: << pipeline.parameters.matrix.macos_universal.deploy >>

  # windows-x86 (msvc_wx32_2022)
  build_msvc_wx32_2022:
    type: boolean
    default: << pipeline.parameters.matrix.msvc_wx32_2022.build >>
  deploy_msvc_wx32_2022:
    type: boolean
    default: << pipeline.parameters.matrix.msvc_wx32_2022.deploy >>

  # android-arm64
  build_android_arm64:
    type: boolean
    default: << pipeline.parameters.matrix.android_arm64.build >>
  deploy_android_arm64:
    type: boolean
    default: << pipeline.parameters.matrix.android_arm64.deploy >>

  # android-armhf
  build_android_armhf:
    type: boolean
    default: << pipeline.parameters.matrix.android_armhf.build >>
  deploy_android_armhf:
    type: boolean
    default: << pipeline.parameters.matrix.android_armhf.deploy >>

    
   
# ------------------------------------------------------------
# JOBS
# ------------------------------------------------------------

jobs:

# ------------------------------------------------------------
# JOB: Linux Catalogue
# ------------------------------------------------------------

  linux-catalogue:
    parameters:
      target: {type: string}
      image: {type: string}
      dockerfile: {type: string, default: ci/Dockerfile.linux}
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: << parameters.target >>
      DOCKER_IMAGE: << parameters.image >>
      DOCKERFILE: << parameters.dockerfile >>
      BUILD_GTK3: "true"
      WX_VER: "32"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Stock-API tests, clean package and archive validation
          shell: /bin/bash
          command: ci/circleci-build-ubuntu-docker.sh
          no_output_timeout: 45m
 
      - retain-artifacts:
          target: << parameters.target >>
          build_dir: build

      - run:
          name: Install Cloudsmith CLI (pipx)
          when: always
          command: |
            sudo apt-get update
            sudo apt-get install -y pipx python3-venv
            pipx ensurepath
            pipx install cloudsmith-cli

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/<< parameters.target >>/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh
            
# ------------------------------------------------------------
# JOB: Flatpak
# ------------------------------------------------------------            

  flatpak:
    parameters:
      arch: {type: string}
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: flatpak
      BUILD_ARCH: << parameters.arch >>
      FLATPAK_BRANCH: stable
      CLOUDSMITH_PKG_EXT: gz
      SDK_VER: "25.08"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh
      - run:
          name: Flatpak build and package
          shell: /bin/bash
          command: ci/circleci-build-flatpak.sh
          no_output_timeout: 45m
          
      - retain-artifacts:
          target: "flatpak-<< parameters.arch >>"
          build_dir: build 
      - run:
          name: Debug Cloudsmith key
          command: |
            echo "CLOUDSMITH_API_KEY length: ${#CLOUDSMITH_API_KEY}"
      - run:
          name: Install Cloudsmith CLI (pipx)
          when: always
          command: |
            sudo apt-get update
            sudo apt-get install -y pipx python3-venv
            pipx ensurepath
            pipx install cloudsmith-cli
   
      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/flatpak-<< parameters.arch >>/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh

# ------------------------------------------------------------
# JOB: macOS Universal
# ------------------------------------------------------------

  macos-universal:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

    environment:
      OCPN_TARGET: macos
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>
      PLUGIN_VERSION: << pipeline.parameters.plugin_version >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh cmake/*.sh

      - run:
          name: Native Apple-Silicon stock-API build, tests and package
          shell: /bin/bash
          command: ci/circleci-build-macos-universal.sh
          no_output_timeout: 45m

      - retain-artifacts:
          target: macos-universal
          build_dir: build
          
# Use orb-based upload instead of custom script
#      - cloudsmith/upload:
#          repo: rick-gleason/weather-routing-beta
#          path: artifacts/macos-arm64/package/weather_routing_pi-*.xml
#          version: << pipeline.parameters.pkg_version >>          

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            export BUILD_DIR="$PWD/build"
            export CLOUDSMITH_PKG_EXT="gz"
            "$BUILD_DIR/cloudsmith-upload.sh"
            
      - store_test_results:
          path: artifacts/macos-arm64/tests

      - store_artifacts:
          path: artifacts/macos-arm64

# ------------------------------------------------------------
# JOB: Windows MSVC
# ------------------------------------------------------------

  windows-x86:
    executor:
      name: win/server-2022
      shell: bash.exe

    environment:
      OCPN_TARGET: MSVC
      MSVC_VERSION: "2022"
      WX_VER: "32"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      
      - run:
          name: Install wget
          command: choco install wget -y

      - run:
          name: Install 7zip
          command: choco install 7zip -y

      - run:
          name: Install NSIS
          command: choco install nsis -y
          
      - run:
          name: Install Poedit
          command: choco install poedit -y

      # Install Python 3 reliably
      - run:
          name: Install Python
          shell: powershell.exe
          command: |
            # Ensure python3 resolves to py.exe or python.exe
            if (-Not (Get-Command python3 -ErrorAction SilentlyContinue)) {
              Set-Alias python3 py
            }

      - run:
          privileged: false
          shell: cmd.exe
          name: Native Windows build, tests and package
          command: ci\circleci-build-msvc.bat
          no_output_timeout: 45m

      - retain-artifacts:
          target: windows-x86
          build_dir: build

      - run:
          name: Cloudsmith upload
          when: always
          shell: bash.exe
          command: |
            if ! command -v python3 >/dev/null 2>&1; then
              alias python3='py'
            fi
            python3 --version
            pip --version
            cd "$(git rev-parse --show-toplevel)"
            chmod +x build/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/build"
            export CLOUDSMITH_PKG_EXT="exe"
            build/cloudsmith-upload.sh

      - store_test_results:
          path: build/test-results

      - store_artifacts:
          path: build
          destination: windows-x86

# ------------------------------------------------------------
# JOB: Android ARM64
# ------------------------------------------------------------

  android-arm64:
    parameters:
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: android-arm64
      WX_VER: "32"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_VERSION: "34"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh

      - run:
          name: Android ARM64 build
          shell: /bin/bash
          command: |
            chmod +x ci/circleci-build-android-arm64.sh
            ci/circleci-build-android-arm64.sh
          no_output_timeout: 45m

      - retain-artifacts:
          target: android-arm64
          build_dir: build

      - run:
          name: Cloudsmith upload
          when: always
          command: |
            cd "$(git rev-parse --show-toplevel)"
            chmod +x ci/cloudsmith-upload.sh
            export BUILD_DIR="$PWD/artifacts/android-arm64/package"
            export CLOUDSMITH_PKG_EXT="gz"
            ci/cloudsmith-upload.sh

# ------------------------------------------------------------
# JOB: Android ARMHF
# ------------------------------------------------------------

  android-armhf:
    parameters:
      resource_class: {type: string, default: medium}

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      OCPN_TARGET: android-armhf
      WX_VER: "32"
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_SDK_VERSION: "34"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CLOUDSMITH_API_KEY: << pipeline.parameters.cloudsmith_api_key >>

    steps:
      - checkout
      - run: chmod a+x ci/*.sh

      - run:  
          name: Android ARMHF build
          shell: /bin/bash
          command: |
            chmod +x ci/circleci-build-android-armhf.sh
            ci/circleci-build-android-armhf.sh
          no_output_timeout: 45m

      - retain-artifacts:
          target: android-armhf
